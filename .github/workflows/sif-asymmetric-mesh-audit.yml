name: SIF asymmetric-mesh audit

on:
  push:
    branches:
      - audit/sif-asymmetric-mesh
  workflow_dispatch:

jobs:
  sif-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Partial_Differential_Equation_Toolbox

      - name: Run reduced SIF verification suite
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); run_ci_sif_audit

      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sif-asymmetric-mesh-audit
          path: verification/sif/outputs
          if-no-files-found: warn
